services:
  panel:
    build: .
    container_name: whatsapp-panel
    restart: unless-stopped
    env_file: .runtime.env
    environment:
      PORT: "3000"
      MEDIA_DIR: /app/data/media
    expose:
      - "3000"
    volumes:
      - panel_media:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [evolution]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  caddy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    container_name: whatsapp-panel-caddy
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks: [evolution]
    depends_on: [panel]
networks:
  evolution:
    external: true
    name: evolution-go_default
volumes:
  panel_media:
  caddy_data:
  caddy_config:
